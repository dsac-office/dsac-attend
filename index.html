/* 레이아웃: 상단 로고 → 이름·기간 → 엑셀 상단 요약표 → 엑셀과 같은 줄 구성의 13주 표(기본/시간외/일근로시간/기본근무시간/근태구분) → 월별 시간외. 회색 바탕 + 흰 카드 + DSAC 청록 포인트 */
:root{
  --bg:#F5F5F7;--surface:#fff;--ink:#1D1D1F;--ink2:#424245;--muted:#6E6E73;--line:#E5E5EA;--track:#E8E8ED;--off:#FAFAFB;--field:#F2F2F5;--row-ot:#EEF7F9;--row-calc:#F1F1F4;--row-lv:#F7F3FB;
  --accent:#58C0D0;--accent-ink:#1A8799;--accent-soft:#E6F7FA;--btn:#1A8799;--on-btn:#fff;
  --warn:#D92D20;--warn-soft:#FDECEA;--warn-line:#F4B6B0;--ok:#0B8A4B;--ok-soft:#E5F5EC;--ok-line:#A5D8BA;--hol:#D92D20;--sat:#2F5FA8;--notice:#FFF6E0;
  --f:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--surface:#1C1C1E;--ink:#F5F5F7;--ink2:#D1D1D6;--muted:#9A9AA0;--line:#2C2C2E;--track:#3A3A3C;--off:#18181A;--field:#2C2C2E;--row-ot:#10262A;--row-calc:#232326;--row-lv:#241E2B;
  --accent:#4CC3D4;--accent-ink:#6FD3E0;--accent-soft:#12343A;--btn:#4CC3D4;--on-btn:#06242a;
  --warn:#FF6B5E;--warn-soft:#3A1A17;--warn-line:#7A3028;--ok:#4CD08A;--ok-soft:#10301F;--ok-line:#24603F;--hol:#FF6B5E;--sat:#7BA6EE;--notice:#3A3014;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--surface:#1C1C1E;--ink:#F5F5F7;--ink2:#D1D1D6;--muted:#9A9AA0;--line:#2C2C2E;--track:#3A3A3C;--off:#18181A;--field:#2C2C2E;--row-ot:#10262A;--row-calc:#232326;--row-lv:#241E2B;
  --accent:#4CC3D4;--accent-ink:#6FD3E0;--accent-soft:#12343A;--btn:#4CC3D4;--on-btn:#06242a;
  --warn:#FF6B5E;--warn-soft:#3A1A17;--warn-line:#7A3028;--ok:#4CD08A;--ok-soft:#10301F;--ok-line:#24603F;--hol:#FF6B5E;--sat:#7BA6EE;--notice:#3A3014;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top .in{max-width:1040px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{height:30px;width:auto;display:block}
.logo.dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.lt{display:none}:root:not([data-theme="light"]) .logo.dk{display:block}}
:root[data-theme="dark"] .logo.lt{display:none}:root[data-theme="dark"] .logo.dk{display:block}
.top nav{display:flex;gap:4px;margin-left:6px;flex-wrap:wrap}
.top nav button{padding:7px 14px;border-radius:980px;color:var(--ink2);font-weight:600;cursor:pointer;border:0;background:transparent;font-size:15px}
.top nav button:hover{background:var(--track)}.top nav button.on{background:var(--accent-soft);color:var(--accent-ink)}
.sp{flex:1}.who{font-weight:600;color:var(--muted);font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.head{display:flex;gap:10px 16px;align-items:flex-end;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(22px,3vw,28px);font-weight:700;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);font-size:15px;font-weight:500}
.card{background:var(--surface);border-radius:18px;padding:18px 22px;min-width:0}
h2{margin:0 0 12px;font-size:20px;font-weight:700}h3{margin:0 0 10px;font-size:17px;font-weight:700}
.mute{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--on-btn);border:0;border-radius:980px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:16px}
.btn:hover{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--accent)}
.btn.sm{padding:6px 14px;font-size:14px}.btn.danger{background:var(--warn);color:#fff}
:root:not([data-theme="light"]) .btn.danger{color:#1a0805}
input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input:disabled,select:disabled{opacity:.55}
select.pill{appearance:none;-webkit-appearance:none;background-color:var(--surface);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 21px) 52%,calc(100% - 16px) 52%;background-size:5px 5px;background-repeat:no-repeat;border-radius:980px;padding:9px 38px 9px 16px;font-weight:700;cursor:pointer;font-size:15px;max-width:100%}
.center{max-width:440px;margin:8vh auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));text-align:left}
.center .logo{height:44px;margin:0 auto 24px}
.center label{display:block;margin:14px 0 6px;font-weight:700}.center input{width:100%;font-size:18px;padding:12px 14px}
.center .btn{width:100%;margin-top:20px;padding:14px;font-size:18px}
#app>.center{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;margin:0 auto}
.err{color:var(--warn);margin-top:12px;min-height:22px;font-weight:600}
.notice{background:var(--notice);border-radius:14px;padding:12px 18px;font-weight:600}

/* 요약 한 장 */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 20px}
.met{min-width:0}
.met .l{font-size:13px;color:var(--muted);font-weight:600}
.met .v{white-space:nowrap;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.25;font-variant-numeric:tabular-nums}
.met .v small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.met .s{font-size:13px;color:var(--muted)}
.met.bad .v,.met.bad .v small{color:var(--warn)}
.status{grid-column:1/-1;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:15px}
.status .ok{color:var(--ok)}.status .bad{color:var(--warn)}
.status .lnk{border:0;background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:8px;padding:2px 8px;cursor:pointer;font-size:14px}

/* 엑셀형 근무계획표 */
.save{font-size:13px;font-weight:600;color:var(--accent-ink)}
.chip{display:inline-block;padding:3px 11px;border-radius:980px;font-size:13px;font-weight:700;background:var(--track);color:var(--ink2);font-variant-numeric:tabular-nums}
.chip.bad{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.pri{background:var(--accent-soft);color:var(--accent-ink)}
.warn{background:var(--warn-soft)!important;color:var(--warn)!important;font-weight:700}
.hol{color:var(--hol)}.sat{color:var(--sat)}
/* 요약: 엑셀 상단 요약표 + 쉬어야 할 시간 */
.sumx{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px 28px;align-items:center}
table.sumt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.sumt th,table.sumt td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.sumt tr:first-child th{font-size:12px;color:var(--muted);font-weight:700}
table.sumt tr:last-child th,table.sumt tr:last-child td{border-bottom:0}
table.sumt th{font-weight:700}
table.sumt .n{text-align:right}
table.sumt .big{font-size:22px;font-weight:700;letter-spacing:-.02em}
table.sumt td:last-child{color:var(--muted);font-size:14px}
table.sumt tr.bad .big,table.sumt tr.bad td:last-child{color:var(--warn)}
.flex .l{font-size:13px;color:var(--muted);font-weight:600}
.flex .v{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ok)}
.flex .v small{font-size:15px;margin-left:3px;color:var(--muted);font-weight:600}
.flex.bad .v{color:var(--warn)}
.flex .s{font-size:13px;color:var(--muted)}
.mon{grid-column:1/-1;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.mon .ml{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.mon .mt{display:flex;align-items:baseline;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 14px}
.mon .mt span{font-size:13px;font-weight:700;color:var(--accent-ink)}
.mon .mt b{font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.mon .mt small{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
@media(max-width:560px){.mon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.mon .ml{grid-column:1/-1}.mon .mt{flex-direction:column;align-items:center;gap:0;padding:6px 4px;min-width:0}.mon .mt b{font-size:18px;white-space:nowrap}}
.status{grid-column:1/-1;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:15px}
.status .ok{color:var(--ok)}.status .bad{color:var(--warn)}
.status .lnk{border:0;background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:8px;padding:2px 8px;cursor:pointer;font-size:14px}
@media(max-width:700px){.sumx{grid-template-columns:1fr}}
@media(max-width:560px){table.sumt tr>*:last-child{display:none}table.sumt td .small{display:block;font-size:11px}table.sumt th,table.sumt td{padding:6px 6px}}

.calcard{padding:14px 0 0;overflow:hidden}
.calhead{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:0 18px 12px}
.calhead b{color:var(--ink)}
.toggle.sm{padding:5px 10px;font-size:13px}
table.xl{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed;font-variant-numeric:tabular-nums;font-size:14px}
table.xl thead th{background:var(--track);color:var(--ink2);font-size:13px;font-weight:700;padding:7px 4px;text-align:center;border:1px solid var(--line)}
table.xl thead th.hol{color:var(--hol)}table.xl thead th.sat{color:var(--sat)}
table.xl th.wk{width:112px}table.xl th.gb{width:92px}table.xl th.tot{width:76px}
table.xl tbody th,table.xl tbody td{border:1px solid var(--line);padding:0;height:32px;text-align:center}
/* 줄 구분: 기본(흰색) · 시간외(연한 청록) · 일근로시간(연회색) · 기본근무시간(작게) · 근태구분(연보라) */
table.xl tr.r-base td,table.xl tr.r-base th.gb{height:36px}
table.xl tr.r-ot td,table.xl tr.r-ot th.gb{background:var(--row-ot);height:36px}
table.xl tr.r-ot td.off{background:var(--row-ot)}
table.xl tr.r-day td,table.xl tr.r-day th.gb{background:var(--row-calc)}
table.xl tr.r-day td.calc{color:var(--ink2);font-weight:700}
table.xl tr.r-txt td,table.xl tr.r-txt th.gb,table.xl tr.r-lv td,table.xl tr.r-lv th.gb{height:26px}
table.xl tr.r-txt th.gb,table.xl tr.r-lv th.gb{font-size:12px;font-weight:600;color:var(--muted)}
table.xl tr.r-txt td input,table.xl tr.r-lv td select{min-height:25px;font-size:12px}
table.xl tr.r-lv td,table.xl tr.r-lv th.gb,table.xl tr.r-lv td.off{background:var(--row-lv)}
table.xl tr.r-ot td.tot{background:var(--row-ot)}table.xl tr.r-day td.tot{background:var(--row-calc)}table.xl tr.r-lv td.tot{background:var(--row-lv)}
table.xl .ls{display:none}
@media(max-width:700px){
  .calcard{padding-top:12px}
  .calhead{padding:0 12px 10px}
  table.xl{min-width:0;font-size:13px}
  table.xl th.wk,table.xl td.mw{display:none}
  table.xl th.gb{width:40px;padding:0 3px;font-size:11px}
  table.xl th.tot{width:40px}
  table.xl thead th{padding:6px 0;font-size:12px}
  table.xl th.gb i{display:none}
  table.xl .lf{display:none}table.xl .ls{display:inline}
  table.xl tr.r-date th.gb{color:var(--ink);font-weight:700}
  table.xl tr.r-txt,table.xl tr.r-lv{display:none}
  table.xl tbody tr.r-date td{padding:0;font-size:10.5px;letter-spacing:-.04em;text-overflow:clip}
  table.xl .hn{display:none}
  table.xl tbody td input,table.xl tbody td select{font-size:14px;padding:0!important;letter-spacing:-.04em}
  table.xl tbody tr.r-ot td input{font-size:13px}
  table.xl tr.r-base td,table.xl tr.r-ot td,table.xl tr.r-base th.gb,table.xl tr.r-ot th.gb{height:38px}
  table.xl td.tot{font-size:12px;letter-spacing:-.03em}
  table.xl tr.r-day td{font-size:12px}
  table.xl tbody.mrow td.mw{border-right:0;background:var(--accent-soft)!important}
table.xl tbody.mrow td{padding:6px 10px}
}
table.xl tbody.mrow td{border:1px solid var(--line);border-top:2px solid var(--ink2);background:var(--accent-soft);text-align:right;padding:6px 16px;height:auto}
table.xl tbody.mrow .mrl{font-size:13px;font-weight:700;color:var(--accent-ink);margin-right:10px}
table.xl tbody.mrow b{font-size:16px;color:var(--ink)}
table.xl tbody.wb{border-top:2px solid var(--ink2)}
table.xl tbody th.wk{background:var(--surface);vertical-align:top;text-align:left;padding:8px 8px;font-weight:600}
table.xl tbody.conf th.wk{background:var(--ok-soft)}
.wn{font-size:15px;font-weight:700}
.wd{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.memo{width:100%;font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.done{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;cursor:pointer}
.done input{width:15px;height:15px;accent-color:var(--ok);margin:0}
tbody.conf .done{color:var(--ok)}
table.xl th.gb{background:var(--off);font-size:13px;font-weight:700;color:var(--ink2);text-align:left;padding:0 8px;white-space:nowrap}
table.xl th.gb i{font-style:normal;font-weight:600;color:var(--muted);font-size:11px;margin-left:2px}
table.xl td.off{background:var(--off)}
table.xl tr.r-date td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;height:24px;font-size:12px;color:var(--ink2);font-weight:600;background:var(--field)}
table.xl tr.r-date td.off{background:var(--field)}
table.xl tr.r-date th.gb{background:var(--field);color:var(--muted);font-weight:600;font-size:12px}
table.xl tr.r-date td.hol,table.xl tr.r-date td.hol b{color:var(--hol)}table.xl tr.r-date td.sat{color:var(--sat)}
.hn{margin-left:4px;font-size:11px}
table.xl td input,table.xl td select{width:100%;height:100%;min-height:31px;border:0;border-radius:0;background:transparent;text-align:center;padding:0 4px;font-size:15px}
table.xl tr.r-base td input{font-weight:700}
table.xl tr.r-ot td input{font-weight:700;color:var(--accent-ink)}
table.xl td input[type=number]{-moz-appearance:textfield}
table.xl td input::-webkit-outer-spin-button,table.xl td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.xl td input.tt{font-size:12px;color:var(--ink2)}
table.xl td input::placeholder{color:var(--muted);opacity:.5}

table.xl td select:hover,table.xl td select:focus{background:var(--field)}
table.xl td select.has{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}

table.xl tr.r-day td{font-size:13px;color:var(--muted);font-weight:600}
table.xl td.c-t span.bad{color:var(--warn);font-weight:800;background:var(--warn-soft);border-radius:6px;padding:0 5px}
table.xl td.calc.bad,table.xl td.tot.bad{background:var(--warn-soft);color:var(--warn);font-weight:700}
table.xl td.tot{background:var(--off);font-weight:700;font-size:15px}
table.xl tr.r-ot td.tot{color:var(--accent-ink)}
table.xl td.tot.bad{color:var(--warn)!important;background:var(--warn-soft)!important}
table.xl tr.r-date td.tot{background:var(--field)}
table.xl tr.r-txt td.tot,table.xl tr.r-lv td.tot{background:var(--off)}
.xin{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.xin:hover{color:var(--accent-ink)}
.xo{display:flex;gap:2px;align-items:center;flex-wrap:wrap}.xo .xin+.xin::before{content:"·";display:inline-block;margin:0 6px 0 0;color:var(--line);text-decoration:none}
.xo #xin{margin-left:8px}
/* PDF·인쇄용 (A4 세로, 흰 바탕) */
#printroot{display:none}
#printroot.render{display:block;position:fixed;left:-12000px;top:0;width:1000px}
.pp{width:1000px;min-height:1414px;padding:44px 40px 60px;background:#fff;color:#111;font-family:var(--f);position:relative;box-sizing:border-box;letter-spacing:0}
.pp-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.pp-t{font-size:26px;font-weight:700}.pp-s{font-size:14px;color:#444}.pp-n{font-size:16px}
.pp-sum{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.pp-sum th,.pp-sum td{border:1px solid #9a9a9a;padding:5px 16px;text-align:center}.pp-sum th{background:#f2f2f2}
.pp-mon{display:flex;gap:20px;font-size:14px;margin:10px 0 14px}

<div id="app"><div class="center"><div class="tdots" role="status" aria-label="불러오는 중"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i></div></div></div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== 저장소 연결: Apps Script 웹앱 (Claude 아티팩트 대신 사용) ===== */
const API_URL="https://script.google.com/macros/s/AKfycbwdy3mwoUb9NewF8RAnBp4267kbBLwVxhvj2PbPIgIgT3x_JxfWv4S1YLHDLBn0BRl50w/exec";
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};
const pollers=new Set();let pollT=null;
function ids_(){return `pw=${encodeURIComponent(LS.g("dsac_pw")||"")}&as=${encodeURIComponent(LS.g("dsac_uid")||"")}&apw=${encodeURIComponent(LS.g("dsac_apw")||"")}`}
const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
function deepMerge(a,b){if(!isObj(b))return b;const out=isObj(a)?{...a}:{};for(const k of Object.keys(b))out[k]=isObj(b[k])&&isObj(out[k])?deepMerge(out[k],b[k]):b[k];return out}
function authErr(j){const e=new Error(j.error||"fail");e.code=j.error||"fail";return e}
const DA={
  async get(key){const r=await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}&${ids_()}`);const j=await r.json();if(!j.ok)throw authErr(j);return j.value},
  async list(prefix){const r=await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix)}&${ids_()}`);const j=await r.json();if(!j.ok)throw authErr(j);return j.value||{}},
  async post(body){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,pw:LS.g("dsac_pw")||"",as:LS.g("dsac_uid")||"",apw:LS.g("dsac_apw")||""})});const j=await r.json();if(!j.ok)throw authErr(j);clearTimeout(pollT);pollT=setTimeout(()=>pollers.forEach(f=>f()),600);return j}
};
function snap(path,v){return{id:path,exists:v!==null&&v!==undefined,data:()=>v}}
function poll(fn,ok,err){let last=null,stop=false;const run=async()=>{if(stop)return;try{const s=await fn();const j=JSON.stringify(s.docs?s.docs.map(d=>[d.id,d.data()]):s.data());if(j!==last){last=j;ok(s)}}catch(e){if(err)err(e)}};pollers.add(run);run();const t=setInterval(()=>{if(!document.hidden)run()},15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!stop)run()});return()=>{stop=true;clearInterval(t);pollers.delete(run)}}
function docRef(path){return{
  async get(){return snap(path,await DA.get(path))},
  async set(v){await DA.post({action:"set",key:path,value:JSON.stringify(v)})},
  async update(patch){const cur=(await DA.get(path))||{};await DA.post({action:"set",key:path,value:JSON.stringify(deepMerge(cur,patch))})},
  async delete(){await DA.post({action:"delete",key:path})},
  onSnapshot(ok,err){return poll(async()=>snap(path,await DA.get(path)),ok,err)}
}}
function colRef(path){return{
  onSnapshot(ok,err){return poll(async()=>{const all=await DA.list(path+"/");return{docs:Object.keys(all).map(k=>({id:k.slice(path.length+1),data:()=>all[k]}))}},ok,err)}
}}
const dbShim={doc:docRef,collection:colRef};
const userShim={
  async id(){return LS.g("dsac_uid")||null},
  async canEdit(){return LS.g("dsac_adm")==="1"},
  async can(){return true},
  async me(){return{name:LS.g("dsac_name")||""}},

};
const dlShim={async save({filename,data}){const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}};

/* 대기 표시: 버튼 안에 작은 스피너 (300ms 뒤에만 보임) */
/* 작성 완료 체크 펄스 (체크할 때만, 움직임 줄이기 설정이면 색만 바뀜) */
function wkBurst(input){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const host=input.parentElement;if(!host)return;
  const cs=getComputedStyle(host);if(cs.position==="static")host.style.position="relative";
  const r=input.getBoundingClientRect(),hr=host.getBoundingClientRect();
  const cx=r.left-hr.left+r.width/2,cy=r.top-hr.top+r.height/2;
  const wrap=document.createElement("span");wrap.className="pburst";wrap.setAttribute("aria-hidden","true");
  wrap.style.cssText=`position:absolute;left:${cx}px;top:${cy}px;width:0;height:0;pointer-events:none;z-index:3`;
  host.appendChild(wrap);
  const ring=document.createElement("span");ring.className="pring";wrap.appendChild(ring);
  ring.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:.9},{transform:"translate(-50%,-50%) scale(2.2)",opacity:0}],{duration:420,easing:"cubic-bezier(.16,1,.3,1)",fill:"forwards"});
  for(let i=0;i<8;i++){
    const p=document.createElement("span");p.className="ppart";wrap.appendChild(p);
    const a=i*Math.PI/4,dx=Math.cos(a)*30,dy=Math.sin(a)*30;
    p.animate([{transform:"translate(-50%,-50%) translate(0,0) scale(1)",opacity:1},{transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.3)`,opacity:0}],{duration:520,easing:"cubic-bezier(.16,1,.3,1)",fill:"forwards"});
  }
  input.animate([{transform:"scale(.7)"},{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:420,easing:"cubic-bezier(.16,1,.3,1)"});
  setTimeout(()=>wrap.remove(),600);
}
function spinBlock(){return '<div class="spin-wrap"><div class="spin" role="status" aria-label="로딩 중"></div></div>'}
function busy(el,on){if(!el)return;const old=el.querySelector(":scope>.spin.inl");if(on){el.disabled=true;if(!old){const s=document.createElement("span");s.className="spin inl";s.setAttribute("role","status");s.setAttribute("aria-label","로딩 중");el.appendChild(s)}}else{el.disabled=false;if(old)old.remove()}}

const wq={};
function merge(a,b){for(const k in b){const v=b[k];if(v&&typeof v==="object"&&!Array.isArray(v))a[k]=merge(a[k]&&typeof a[k]==="object"?a[k]:{},v);else a[k]=v}return a}
function setSaved(t){const e=$("#saved");if(e)e.textContent=t}
function save(target,patch){const q=wq[target]??={patch:{},timer:null,busy:false};merge(q.patch,patch);clearTimeout(q.timer);q.timer=setTimeout(()=>flush(target),450);setSaved("저장 중…")}
async function flush(target){
  const q=wq[target];if(!q||!Object.keys(q.patch).length)return;
  if(q.busy){q.timer=setTimeout(()=>flush(target),300);return}
  const p=q.patch;q.patch={};q.busy=true;
  try{await db.doc("sheets/"+target).update(p);setSaved("저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}))}
  catch(e){setSaved("");toast(e&&e.code==="invalid_argument"?"저장할 권한이 없어요. 링크 공유 설정을 확인해 주세요":"저장하지 못했어요. 잠시 뒤 다시 시도해 주세요",true)}
  q.busy=false;if(Object.keys(q.patch).length)flush(target)
}
const pending=t=>{const q=wq[t];return !!q&&(q.busy||Object.keys(q.patch).length>0)};

/* ===== 계산 (엑셀 근무계획표와 같은 규칙) ===== */
function sheetData(doc,pid){
  const pp=(doc&&doc.p&&doc.p[pid])||{};
  const entries={};for(const[date,e]of Object.entries(pp.d||{}))entries[date]={base:+e.b||0,ot:+e.o||0,hours_text:e.t||"",leave:e.l||""};
  return{entries,weeks:pp.w||{},months:pp.mo||{}};
}
function dayOf(date,dow,entries,hol,st){
  const e=entries[date];
  if(e)return{...e,saved:true};
  return{base:(dow>=1&&dow<=5&&!hol[date])?st.default_daily_base:0,ot:0,hours_text:"",leave:"",saved:false};
}
function calcSheet(period,entries,hol,monthCnt){
  const st=cfg.settings,leave=Object.fromEntries(st.leave_types.map(l=>[l.name,l]));
  const weeks=[];let baseEval=0,otMin=0,extraSum=0,shortSum=0,warnWeeks=0,warnDays=0;const months={};
  for(let w=0;w<period.weeks;w++){
    let base=0,ot=0,credit=0;const days=[];
    for(let d=0;d<7;d++){
      const date=addDays(period.start_date,w*7+d),e=dayOf(date,d,entries,hol,st),holiday=hol[date];
      const cr=(d>=1&&d<=5&&holiday)?st.holiday_credit:(leave[e.leave]?.credit??0);
      const actual=e.base+e.ot/60,dayWarn=actual>st.day_max+EPS;if(dayWarn)warnDays++;
      days.push({date,d,e,holiday,credit:cr,actual,dayWarn});base+=e.base;ot+=e.ot;credit+=cr;
      const ym=date.slice(0,7);(months[ym]??={min:0,days:0});months[ym].min+=e.ot;months[ym].days++;
    }
    const evalH=base+credit,delta=evalH-st.avg_base;
    const f={base:base>st.base_week_max+EPS,ot:ot>st.ot_week_max*60+EPS,total:base+ot/60>st.total_week_max+EPS};
    const warn=f.base||f.ot||f.total||days.some(x=>x.dayWarn);if(warn)warnWeeks++;
    weeks.push({w,days,base,ot,credit,evalH,delta,total:base+ot/60,f,warn,start:addDays(period.start_date,w*7),end:addDays(period.start_date,w*7+6)});
    baseEval+=evalH;otMin+=ot;extraSum+=Math.max(0,delta);shortSum+=Math.max(0,-delta);
  }
  const avgBase=baseEval/period.weeks,avgOt=otMin/60/period.weeks,needLeave=Math.max(0,extraSum-shortSum);
  const mlist=Object.keys(months).sort().map(ym=>{const cnt=+monthCnt[ym]||0,m=months[ym];return{ym,cnt,ot:m.min/60,net:(m.min-480*cnt)/60,days:m.days,partial:m.days<new Date(+ym.slice(0,4),+ym.slice(5),0).getDate()}});
  return{weeks,baseEval,avgBase,avgOt,otMin,extraSum,shortSum,needLeave,warnWeeks,warnDays,months:mlist,avgBaseBad:avgBase>st.avg_base+EPS,avgOtBad:avgOt>st.avg_ot_max+EPS};
}

/* 월별 접기: 주의 수요일이 속한 달 기준, 상태는 본인 근무표 문서(ui.fold)에 저장 */
let SCROLLED=null;
function setTopH(){const R=document.documentElement.style,t=document.querySelector(".top"),sm=document.getElementById("sum"),ch=document.querySelector(".calhead");if(t)R.setProperty("--toph",t.offsetHeight+"px");if(sm)R.setProperty("--sumh",(sm.offsetHeight+12)+"px");if(ch)R.setProperty("--calh",ch.offsetHeight+"px")}
addEventListener("resize",setTopH);const LOCAL_FOLD={};
const weekMonth=w=>{const P=curPeriod(),cnt={};for(let i=0;i<P.weeks*7;i++){const ym=addDays(P.start_date,i).slice(0,7);cnt[ym]=(cnt[ym]||0)+1}
  for(const d of [3,6,0]){const m=addDays(P.start_date,w*7+d).slice(0,7);if(cnt[m]>=15)return m}return addDays(P.start_date,w*7+3).slice(0,7)};

function foldRow(w){const m=weekMonth(w);if(w>0&&weekMonth(w-1)===m)return"";return`<tbody class="fold"><tr><td colspan="10"><div class="fbar" data-fold="${m}"><b>${+m.slice(5)}월</b><span class="fn"></span><span class="sp"></span><button class="fbtn"><span class="ft">접기</span> <span class="fi">▴</span></button></div></td></tr></tbody>`}
function applyFold(){const F=foldState(),P=curPeriod();for(let w=0;w<P.weeks;w++){const tb=$("#wb"+w);if(tb)tb.style.display=F[weekMonth(w)]?"none":""}
  document.querySelectorAll("#cal [data-fold]").forEach(b=>{const m=b.dataset.fold,c=!!F[m],n=Array.from({length:P.weeks},(_,w)=>w).filter(w=>weekMonth(w)===m).length;b.querySelector(".fi").textContent=c?"▾":"▴";b.querySelector(".ft").textContent=c?"펼치기":"접기";b.querySelector(".fn").textContent=c?`${n}주 접혀 있음`:"";b.classList.toggle("closed",c)})}
function monthRow(w){
  const P=curPeriod(),cnt={};for(let i=0;i<P.weeks*7;i++){const ym=addDays(P.start_date,i).slice(0,7);cnt[ym]=(cnt[ym]||0)+1}
  for(let d=0;d<7;d++){const dt=addDays(P.start_date,w*7+d),nx=addDays(dt,1);if((nx.slice(5,7)!==dt.slice(5,7)||(w===P.weeks-1&&d===6))&&cnt[dt.slice(0,7)]>=15)
    return`<tbody class="mrow"><tr><td class="mw"></td><td colspan="9"><span class="mrl">${+dt.slice(5,7)}월 시간외 합계</span><b id="mr${dt.slice(0,7)}"></b></td></tr></tbody>`}
  return"";

function weekBlock(w){

  const td=(o,html,cls="")=>`<td class="${o.off?"off ":""}${cls}">${html}</td>`;
  const dateRow=D.map(o=>`<td title="${esc(o.holiday||"")}" class="dn${o.off?" off":""}${o.d===0||o.holiday?" hol":o.d===6?" sat":""}">${md(o.date)}${o.holiday?`<span class="hn">${esc(o.holiday.replace(/\s*대체\s*공휴일$/,"(대체)").replace(/\s*연휴$/,""))}</span>`:""}</td>`).join("");

  const dayRow=D.map(o=>`<td class="calc${o.off?" off":""}" id="t${o.date}"></td>`).join("");
  const txtRow=D.map(o=>td(o,`<input type="text" class="tt" maxlength="24" placeholder="${(o.d>=1&&o.d<=5&&!o.holiday)?"09시~18시":""}" data-k="hours_text" data-d="${o.date}" aria-label="${md(o.date)} 기본근무시간" value="${esc(o.x.hours_text)}" ${dis}>`)).join("");
  const lvRow=D.map(o=>td(o,`<select data-k="leave" data-d="${o.date}" aria-label="${md(o.date)} 근태구분" class="${o.x.leave?"has":""}" ${dis}><option value=""></option>${st.leave_types.map(l=>`<option ${l.name===o.x.leave?"selected":""}>${esc(l.name)}</option>`).join("")}</select>`)).join("");
  const rows=6;
  return`<tbody class="wb" id="wb${w}"><tr class="r-date"><th class="wk" rowspan="${rows}"><div class="wn">${w+1}주차</div><div class="wd">${md(s)} ~ ${md(e)}</div><label class="wcf"><input type="checkbox" id="cf${w}" data-wc="${w}" ${ws.c?"checked":""} ${dis}> 작성 완료</label></th>
    <th class="gb"><span class="lf">날짜</span><span class="ls">${w+1}주</span></th>${dateRow}<td class="tot"></td></tr>
  <tr class="r-base"><th class="gb">기본 <i>시간</i></th>${baseRow}<td class="tot" id="sb${w}"></td></tr>
  <tr class="r-ot"><th class="gb">시간외 <i>분</i></th>${otRow}<td class="tot" id="so${w}"></td></tr>
  <tr class="r-day"><th class="gb"><span class="lf">일근로시간</span><span class="ls">근로</span></th>${dayRow}<td class="tot" id="st${w}"></td></tr>
  <tr class="r-txt"><th class="gb">기본근무시간</th>${txtRow}<td class="tot"></td></tr>
  <tr class="r-lv"><th class="gb">근태구분</th>${lvRow}<td class="tot"></td></tr></tbody>`;
}
function paint(){
  const P=curPeriod(),st=cfg.settings,hol=holMap(),dis=T.ro?"disabled":"";

function monthCells(X,rowOf,col){
  const out=[];
  for(const m of X.r.months){
    if(m.days<15)continue;
    const ranges=[];let lastW=0;
    X.r.weeks.forEach(wk=>{
      const ds=wk.days.filter(dy=>dy.date.slice(0,7)===m.ym);if(!ds.length)return;lastW=wk.w;
      const a=col(ds[0].d),b=col(ds[ds.length-1].d),row=rowOf(wk.w)+1;
      ranges.push(a===b?`${a}${row}`:`${a}${row}:${b}${row}`);
    });
    out.push({ym:m.ym,ot:m.ot,ranges,lastW});
  }
  return out;
}

  const thead=`<thead><tr><th class="c-w">주차</th><th class="c-g">구분</th>${DOW.map((d,i)=>`<th class="${i===0?"hol":i===6?"sat":""}">${d}</th>`).join("")}<th class="c-t">합계</th></tr></thead>`;
  const wkHtml=wk=>{
    const memo=(X.sd.weeks[wk.w]||{}).m||"";
    const row=(lb,cells,tot,cls="")=>`<tr class="${cls}"><th class="c-g">${lb}</th>${cells}<td class="c-t">${tot}</td></tr>`;
    return`<tbody><tr class="r0"><th class="c-w" rowspan="6"><b>${wk.w+1}주차</b><br>${md(wk.start)}~${md(wk.end)}${memo?`<div class="memo">${esc(memo)}</div>`:""}</th><th class="c-g">날짜</th>${wk.days.map(dy=>`<td class="dt ${dy.d===0||dy.holiday?"hol":dy.d===6?"sat":""}">${md(dy.date)}</td>`).join("")}<td class="c-t"></td></tr>
    ${row("기본",wk.days.map(dy=>`<td>${dy.e.base}</td>`).join(""),`<span class="${wk.f.base?"bad":""}">${f1(wk.base)}</span>`)}

    ${row("일근로시간",wk.days.map(dy=>`<td class="${dy.dayWarn?"bad":""}">${dy.actual>0?f1(dy.actual):""}</td>`).join(""),`<span class="${wk.f.total?"bad":""}">${f1(wk.total)}</span>`,"r-c")}
    ${row("기본근무시간",wk.days.map(dy=>`<td class="sm">${esc(dayText(dy))}</td>`).join(""),"","r-c sm")}
    ${row("근태구분",wk.days.map(dy=>`<td class="sm">${esc(dy.e.leave||"")}</td>`).join(""),"","r-l sm")}</tbody>`;
  };
  const pages=[],W=r.weeks;let i=0,first=true;
  while(i<W.length){const n=first?8:10;pages.push(`<div class="pp">${first?head:`<div class="pp-c">${esc(X.emp.name||"")} · ${esc(P.name)} (계속)</div>`}<table class="pp-t2">${thead}${W.slice(i,i+n).map(wkHtml).join("")}</table><div class="pp-f">${pages.length+1}</div></div>`);i+=n;first=false}

/* ===== 엑셀 근무계획표 불러오기 (1~4분기 시트, 주마다 기본/시간외/일근로시간/기본근무시간/근태구분 5줄) ===== */
const xSerial=n=>new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5).toISOString().slice(0,10);
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"}),out=[];
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    const d={},w={};let first=null,wi=0;
    const num=v=>typeof v==="number"?v:(v!=null&&v!==""&&!isNaN(+v)?+v:0);
    const str=v=>v==null?"":String(v).trim();
    for(let i=0;i<rows.length;i++){
      const r=rows[i]||[];
      if(str(r[5])!=="기본"||typeof r[2]!=="number")continue;
      const start=xSerial(r[2]);first??=start;
      const lab={};for(let j=i;j<Math.min(i+6,rows.length);j++){const l=str((rows[j]||[])[5]);if(l&&!(l in lab))lab[l]=rows[j]||[]}
      const ot=lab["시간외"]||[],tx=lab["기본근무시간"]||[],lv=lab["근태구분"]||[];
      for(let k=0;k<7;k++){const date=addDays(start,k);d[date]={b:num(r[6+k]),o:Math.round(num(ot[6+k])),t:str(tx[6+k]),l:str(lv[6+k])}}
      const memo=str((rows[i+1]||[])[2]);
      const idx=Math.round((pd(start)-pd(first))/(7*864e5));if(memo)w[idx]={c:0,m:memo};
      wi++;
    }
    if(!first)continue;
    const per=cfg.periods.find(p=>p.start_date===first)||cfg.periods.find(p=>first>=p.start_date&&first<addDays(p.start_date,p.weeks*7));
    out.push({name,first,weeks:wi,per,d,w});
  }
  return out;
}
async function importXlsx(file,target){

  let found;
  try{found=parseWorkbook(await file.arrayBuffer())}catch{return toast("엑셀 파일을 읽지 못했어요",true)}

    try{await db.doc("sheets/"+target).update({p:patch});close();
      if(pick.length&&!pick.find(x=>x.per.id===S.periodId)){S.periodId=pick[pick.length-1].per.id}

  };
}

function bindSheet(){
  const root=$("#cal"),st=cfg.settings;
  const onEdit=e=>{
    const t=e.target,k=t.dataset.k,date=t.dataset.d;if(!k)return;
    const doc=getDoc(T.uid),pp=ensure(doc,T.pid),sd=sheetData(doc,T.pid),hol=holMap();
    const dow=new Date(pd(date)).getUTCDay(),cur=dayOf(date,dow,sd.entries,hol,st);
    if(k==="base")cur.base=Math.max(0,Math.min(24,parseFloat(t.value)||0));
    else if(k==="ot")cur.ot=Math.max(0,Math.min(1440,Math.round(parseFloat(t.value)||0)));
    else if(k==="hours_text")cur.hours_text=t.value.slice(0,24);
    else if(k==="leave"){
      cur.leave=t.value;const lt=st.leave_types.find(l=>l.name===t.value);
      const bv=t.value===""?((dow>=1&&dow<=5&&!hol[date])?st.default_daily_base:0):(lt&&lt.base!==null&&lt.base!==undefined?lt.base:null);
      if(bv!==null){cur.base=bv;const bi=$(`input[data-k=base][data-d="${date}"]`);if(bi)bi.value=bv}
    }
    const rec={b:cur.base,o:cur.ot,t:cur.hours_text,l:cur.leave};pp.d[date]=rec;
    save(T.uid,{p:{[T.pid]:{d:{[date]:rec}}}});paint();
  };
  const wkSave=w=>{const doc=getDoc(T.uid),pp=ensure(doc,T.pid),rec={c:$("#cf"+w).checked?1:0,m:(pp.w[w]&&pp.w[w].m)||""};pp.w[w]=rec;save(T.uid,{p:{[T.pid]:{w:{[w]:rec}}}});paint()};
  root.addEventListener("input",e=>{if(e.target.dataset.k&&e.target.dataset.k!=="leave")onEdit(e)});
  root.addEventListener("change",e=>{const t=e.target;if(t.dataset.k==="leave")onEdit(e);else if(t.dataset.wc!==undefined){const w=+t.dataset.wc;wkSave(w);if(t.checked){const n=$("#cf"+w);if(n)wkBurst(n)}}});
  /* 엑셀처럼 Enter·화살표로 칸 이동 */
  root.addEventListener("keydown",e=>{
    const t=e.target;if(!t.matches("input[data-k]"))return;
    const mv={ArrowUp:-1,ArrowDown:1,Enter:1}[e.key];if(mv===undefined)return;
    if(t.type==="number"&&(e.key==="ArrowUp"||e.key==="ArrowDown"))e.preventDefault();
    const k=t.dataset.k,all=[...root.querySelectorAll(`input[data-k="${k}"]`)],i=all.indexOf(t),d=new Date(pd(t.dataset.d)).getUTCDay();
    const same=all.filter(x=>new Date(pd(x.dataset.d)).getUTCDay()===d),j=same.indexOf(t)+mv;
    if(e.key==="Enter"){e.preventDefault();const n=all[i+1];if(n){n.focus();n.select&&n.select()}return}
    const n=same[j];if(n){n.focus();n.select&&n.select()}
  });
}

const rowsOf=p=>{
  const hol=holMap(),byEmp={},rows=[];
  for(const[u,doc]of Object.entries(S.all)){
    if(!doc||!doc.emp)continue;const ro=S.roster&&S.roster[doc.emp.id];if(ro&&ro.active===false)continue;if(Object.keys(S.roster||{}).length&&!ro)continue;
    const emp={...doc.emp,team:(ro&&ro.team)||doc.emp.team||"",name:(ro&&ro.name)||doc.emp.name||"",rank:(ro&&ro.rank)||doc.emp.rank||"",seq:(ro&&ro.seq)||999};
    const sd=sheetData(doc,p.id),r=calcSheet(p,sd.entries,hol,sd.months);
    const conf=Object.values(sd.weeks).filter(x=>x&&x.c).length,started=Object.keys(sd.entries).length>0||conf>0;
    (byEmp[doc.emp.id]??=[]).push(u);
    rows.push({u,emp,r,conf,started,issue:r.warnWeeks>0||r.avgBaseBad||r.avgOtBad});

  return{rows,missing};
};

const OT=(()=>{
const DOW=["일","월","화","수","목","금","토"];
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const addDays=(s,n)=>new Date(pd(s).getTime()+n*864e5).toISOString().slice(0,10);
const kdate=s=>`${+s.slice(5,7)}. ${+s.slice(8,10)}.`;
const md=s=>`${+s.slice(5,7)}/${+s.slice(8,10)}`;
const today=()=>{const n=new Date(Date.now()+9*36e5);return n.toISOString().slice(0,10)};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+(m||0)};
const hm=t=>t?`${+t.slice(0,2)}:${t.slice(3,5)}`:"";
/* 시간 입력: 22, 2200, 22:00, 22시30분, 9:5 → 24시간 표기 HH:MM */
function normT(v){
  v=String(v||"").trim();if(!v)return "";
  let h,m;const p=v.match(/^(\d{1,2})\s*[:시.\s]\s*(\d{0,2})\s*분?$/);
  if(p){h=+p[1];m=p[2]===""?0:+p[2]}
  else if(/^\d{1,4}$/.test(v)){if(v.length<=2){h=+v;m=0}else{h=+v.slice(0,-2);m=+v.slice(-2)}}
  else return "";
  if(h>24||m>59||(h===24&&m>0))return "";
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

const HOL=new Set(["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-02","2026-05-01","2026-05-05","2026-05-25","2026-06-03","2026-07-17","2026-08-17","2026-09-24","2026-09-25","2026-10-05","2026-10-09","2026-12-25",
 "2027-01-01","2027-02-05","2027-02-06","2027-02-07","2027-02-08","2027-03-01","2027-05-01","2027-05-05","2027-05-13","2027-06-06","2027-07-17","2027-08-15","2027-08-16","2027-09-14","2027-09-15","2027-09-16","2027-10-03","2027-10-04","2027-10-09","2027-10-11","2027-12-25","2027-12-27","2028-01-01"]);
const isHol=d=>{const w=pd(d).getUTCDay();return w===0||w===6||HOL.has(d)};
const kindOf=it=>it.k||(isHol(it.d)?"휴일":"평일");
const kindLabel=it=>`${kindOf(it)}(${DOW[pd(it.d).getUTCDay()]})`;
/* 수당시간 자동 계산: 평일은 기본근무 종료(기본 18시) 이후, 휴일은 근무시간에서 휴게 제외(4시간 이하 0분, 4시간 초과~8시간 29분 30분, 8시간 30분 이상 60분) */
function autoMin(k,s,e,be,fr,brk){
  const a=toMin(s),b=toMin(e);if(a==null||b==null||b<=a)return 0;
  if(k==="평일")return Math.max(0,b-Math.max(a,toMin(be||"18:00")));
  // 휴일: 기본근무(사용 시) "9:00~15:00"의 끝 이후 시간이 초과. 그 구간에 휴게 표를 적용
  const m=String(fr||"").match(/~\s*(\d{1,2})(?::(\d{2}))?/);
  const tot=b-a,d=tot>=540?60:tot>240?30:0;if(m){const ye=toMin(String(+m[1]).padStart(2,"0")+":"+(m[2]||"00"));if(ye!=null&&b>ye){const w=b-Math.max(a,ye);return brk==="base"&&d===60?w:Math.max(0,w-d)}}
  return Math.max(0,tot-d);
}

  </div></div>`;

function brkOf(){return document.querySelector("#fbr .on")?.dataset.v||"ot"}
function bindForm(it){
  let k=it&&it.k||(isHol($("#fd").value)?"휴일":"평일"),mTouched=!!(it&&it.m!=="");
  const setK=x=>{k=x;$("#fk").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));$("#f .wd-only").hidden=k==="휴일";$("#f .hd-only").hidden=k!=="휴일";recalc()};
  const tv=id=>normT($(id).value);
  const updBk=()=>{const el=$("#fbk"),sel=$("#fbr");if(!el)return;const a=toMin(tv("#fs")),e2=toMin(tv("#fe"));const tot=(a!=null&&e2!=null)?e2-a:0;const d=tot>=540?60:tot>240?30:0;const big=k==="휴일"&&d>0;if(sel)sel.hidden=!(k==="휴일"&&d===60);if(!big){el.textContent="";return}el.textContent=`휴게 ${d}분 자동 차감`};
  const recalc=()=>{if(!mTouched)$("#fm").value=tv("#fe")?autoMin(k,tv("#fs"),tv("#fe"),tv("#fb"),$("#fr")?.value,brkOf()):"";updBk()};
  $("#fk").onclick=e=>{const b=e.target.closest("button");if(b)setK(b.dataset.k)};

  ["#fs","#fe","#fb","#fr"].forEach(id=>{const el=$(id);el.oninput=()=>{mTouched=false;recalc()};el.onblur=()=>{const n=normT(el.value);if(n)el.value=n}});
  $("#fm").oninput=()=>{mTouched=$("#fm").value!=="";updBk()};
  $("#fbr").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("#fbr").querySelectorAll("button").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});mTouched=false;recalc()};
  recalc();
  if(it)$("#fc").onclick=()=>{S.edit=null;render()};
  $("#fo").onclick=async()=>{
    const d=$("#fd").value,s=tv("#fs"),e=tv("#fe"),w=$("#fw").value.trim(),be=k==="평일"?(tv("#fb")||"18:00"):"",m=$("#fm").value===""?autoMin(k,s,e,be,$("#fr")?.value,brkOf()):Math.round(+$("#fm").value);

  };
}
function itemRow(it,mine){

  <div class="t"><div><b>${hm(it.s)}~${hm(it.e)}</b> · <b>${it.m}분</b>${it.r?` <span class="m">(${esc(it.r)})</span>`:""}</div><div class="w">${esc(it.w)}</div></div>

function renderMe(){
  const list=items(S.mine).sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);

/* 수합자: 신청 목록 */
function allItems(){const out=[];for(const[u,doc]of Object.entries(S.all))for(const it of items(doc))out.push({...it,uid:u,name:doc.name||"",rk:doc.rank||""});return out}
function pendingAll(){return allItems().filter(x=>x.st!=="done")}
const sortG=(a,b)=>a.d.localeCompare(b.d)||a.ts-b.ts;
function titleOf(from,to){const y=from.slice(0,4);return`시간외근무 신청서(${y}. ${kdate(from)}${to&&to!==from?"~"+(to.slice(0,4)!==y?to.slice(0,4)+". ":"")+kdate(to):""})`}
function minCell(x){return`${x.m}${x.r?`\n(${x.r})`:""}`}
function renderAdmin(){
  if(window.__loadAdminOT)window.__loadAdminOT();
  if(!S.adminLoaded){app().innerHTML=shell(spinBlock());return}
  const all=pendingAll().sort(sortG);
  const pend=S.rk?all.filter(x=>x.rk===S.rk):all;
  const rkIdx=r=>{const k=["4급","5급","6급","7급"].indexOf(r);return k<0?99:k};
  const rkNames=[...new Set(all.map(x=>x.rk||"미정"))].sort((a,b)=>rkIdx(a)-rkIdx(b));
  const days=[...new Set(pend.map(x=>x.d))];
  const todayK=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  const wkend=d=>{const w=pd(d).getUTCDay();return w===6?[d,addDays(d,1)]:w===0?[addDays(d,-1),d]:null};
  if(!S.from||!S.to){S.from=S.to=todayK;const we=wkend(todayK);if(we)[S.from,S.to]=we}
  if(S.allOn&&pend.length){const ds=pend.map(x=>x.d).sort();S.from=ds[0];S.to=ds[ds.length-1]}
  const rows=S.allOn?pend:pend.filter(x=>S.from&&x.d>=S.from&&x.d<=S.to);
  const title=S.from?titleOf(S.from,S.to):"";
  const done=allItems().filter(x=>x.st==="done");
  const groups={};for(const x of done)(groups[x.dt||"(제목 없음)"]??=[]).push(x);
  const gl=Object.entries(groups).sort((a,b)=>Math.max(...b[1].map(x=>x.da||0))-Math.max(...a[1].map(x=>x.da||0))).slice(0,S.showDone?100:6);
  const cnt=d=>pend.filter(x=>x.d===d).length;
  app().innerHTML=shell(`<div class="head"><div><h1>시간외 신청현황</h1><p>기안 올리기 전 ${all.length}건</p></div><span class="sp"></span><label class="tgl"><input type="checkbox" role="switch" id="allp" ${S.allOn?"checked":""}><span class="trk"><span class="knob"></span></span><span class="tl">전체 보기</span></label></div>
  <div class="card">${!all.length?`<div class="empty">기안할 신청이 없어요</div>`:`
  <div class="pick" style="margin-top:10px"><input type="date" id="af" value="${S.from}"><span class="mute">~</span><input type="date" id="at" value="${S.to}"></div>
  <div class="ttl"><span class="tt" id="tt">${esc(title)}</span></div>
  <div class="otw"><table class="gi"><thead><tr><th>연번</th><th>일 자</th><th>구 분</th><th>성 명</th><th>출근시간</th><th>퇴근시간</th><th>수당시간</th><th>근무내역</th></tr></thead><tbody>
  ${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${kdate(x.d)}</td><td>${kindLabel(x)}</td><td>${esc(x.name)}</td><td>${hm(x.s)}</td><td>${hm(x.e)}</td><td>${x.m}${x.r?`<small>(${esc(x.r)})</small>`:""}</td><td class="wk">${esc(x.w)}</td></tr>`).join("")||`<tr><td colspan="8" class="mute">이 기간에 신청이 없어요</td></tr>`}
  </tbody></table></div>
  ${rows.length?`<div class="acts"><button class="btn" id="cp">표 복사</button><button class="btn ghost" id="xl">엑셀 받기</button><span class="sp"></span></div>`:""}`}
  </div>
  `);
  app().querySelectorAll("[data-rk]").forEach(b=>b.onclick=()=>{S.rk=b.dataset.rk;S.from=S.to=null;render()});
  app().querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    const d=b.dataset.day;
    if(S.from===S.to&&d!==S.from){S.from=d<S.from?d:S.from;S.to=d>S.to?d:S.to}
    else{S.from=d;S.to=d}
    render();
  });
  const af=$("#af"),at=$("#at");
  const allp=$("#allp");if(allp)allp.onchange=()=>{S.allOn=allp.checked;if(!S.allOn){S.from=S.to=null}render()};
  if(af){af.onchange=()=>{S.allOn=false;if(af.value){S.from=af.value;const we=wkend(af.value);if(we)[S.from,S.to]=we;else if(S.to<S.from||wkend(S.to))S.to=S.from;render()}};at.onchange=()=>{S.allOn=false;if(at.value){S.to=at.value;if(S.to<S.from)S.from=S.to;render()}}}
  const cp=$("#cp");if(cp)cp.onclick=()=>copyTable(rows);
  const xl=$("#xl");if(xl)xl.onclick=()=>downloadXlsx(rows,title);
  const mo=$("#more");if(mo)mo.onclick=()=>{S.showDone=true;render()};

}
async function setStatus(rows,patch,msg){
  const by={};for(const x of rows)(by[x.uid]??={})[x.id]=patch;
  try{for(const[u,its]of Object.entries(by))await db.doc("ot/"+u).update({items:its});toast(msg);S.from=S.to=null}
  catch{toast("저장하지 못했어요. 잠시 뒤 다시 시도해 주세요",true)}

function markDone(rows,title,btn){btn.disabled=true;setStatus(rows,{st:"done",dt:title,da:Date.now()},`${rows.length}건을 상신 취소로 표시했어요`)}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch{toast("복사하지 못했어요",true)}}
async function copyTable(rows){
  const head=["연번","일 자","구 분","성 명","출근시간","퇴근시간","수당시간","근무내역"];
  const vals=rows.map((x,i)=>[i+1,kdate(x.d),kindLabel(x),x.name,hm(x.s),hm(x.e),minCell(x),x.w]);
  const td='style="border:1px solid #000;padding:4px 6px;text-align:center"';

  const tsv=[head,...vals].map(r=>r.map(c=>{c=String(c);return /[\n\t"]/.test(c)?`"${c.replace(/"/g,'""')}"`:c}).join("\t")).join("\n");
  try{
    if(window.ClipboardItem)await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([tsv],{type:"text/plain"})})]);
    else await navigator.clipboard.writeText(tsv);
    toast(`${rows.length}건을 복사했어요. 기안 표에 붙여넣으세요`);
  }catch{try{await navigator.clipboard.writeText(tsv);toast(`${rows.length}건을 복사했어요`)}catch{toast("복사하지 못했어요",true)}}
}
async function downloadXlsx(rows,title){

  if(!dl)return toast("이 화면에서는 파일을 받을 수 없어요",true);
  const aoa=[[],[null,"순번","일 자","구 분","성 명","출근시간","퇴근시간","수당시간","근무내역","비 고"],...rows.map((x,i)=>[null,i+1,kdate(x.d),kindLabel(x),x.name,hm(x.s),hm(x.e),x.m,x.w,x.r?`(${x.r})`:""])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=[{wch:2},{wch:6},{wch:9},{wch:10},{wch:9},{wch:9},{wch:9},{wch:9},{wch:40},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"양식변경");
  const data=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  try{await dl.save({filename:title.replace(/[\\/:*?"<>|]/g,"")+".xlsx",data:new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})})}catch{}
}

/* 시작 */
function usable(){const a=document.activeElement;return !(a&&a.closest&&a.closest(".of,.center,.pick"))}
async function boot(){
  try{db=await claude.use("db");userNS=await claude.use("user");dl=await claude.use("downloads")}catch{}
  if(userNS){uid=await userNS.id();isAdmin=await userNS.canEdit()}
  S.ready=true;
  if(!db||!uid)return;
  S.view="me";
  const tm=setTimeout(()=>{if(S.mine===undefined){S.mine=null;render()}},10000);
  db.doc("ot/"+uid).onSnapshot(s=>{
    clearTimeout(tm);
    const d=s.exists?structuredClone(s.data()):null,had=S.mine;
    if(JSON.stringify(d)===JSON.stringify(had))return;
    S.mine=d;try{LS.s("dsac_c_ot",JSON.stringify(d))}catch(e){}
    if(usable()||had===undefined||!had||!had.name)render(window.MODE==="home");
  },()=>{clearTimeout(tm);S.mine=null;render()});
  window.__loadAdminOT=()=>{if(!isAdmin||window.__adminOTOn)return;window.__adminOTOn=true;db.collection("ot").onSnapshot(s=>{
    S.adminLoaded=true;const all={};s.docs.forEach(x=>all[x.id]=structuredClone(x.data()));
    const ch=JSON.stringify(all)!==JSON.stringify(S.all);S.all=all;
    if(ch)render(true);
  },()=>{});};
}

return{start:boot,toMe:()=>{S.view="me";S.edit=null},render,rank:()=>S.mine&&S.mine.rank||"",pending:()=>isAdmin?pendingAll().length:0,mine:()=>S.mine?items(S.mine).filter(x=>x.st!=="done").length:0};
})();
boot();OT.start();

  document.body.append(p,b);
  const pin=p.querySelector("#fabpin");pin.checked=pinned;
  const esc2=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const drawT=()=>{const box=p.querySelector(".fab-t");const K=new Date(Date.now()+9*3600e3).toISOString(),ym=K.slice(0,7),today=K.slice(0,10);
    const rows=[];try{for(const pp of Object.values((S.my&&S.my.p)||{}))for(const[dk,e]of Object.entries((pp&&pp.d)||{}))if(dk.slice(0,7)===ym&&dk<today&&(+e.o||0)>0)rows.push([dk,+e.o])}catch(e){}
    rows.sort((a,b)=>a[0].localeCompare(b[0]));const tot=rows.reduce((a,r)=>a+r[1],0);
    if(!rows.length){box.innerHTML='<div class="fab-e">이번 달 근무표에 입력된 시간외가 없어요</div>';return}
    const max=Math.max(...rows.map(r=>r[1]),60),W=236,H=92,bw=Math.max(8,Math.min(28,(W-8)/rows.length-6));
    const bars=rows.map((r,k)=>{const h=Math.max(4,Math.round(r[1]/max*(H-22))),x=4+k*((W-8)/rows.length),y=H-18-h;return `<rect x="${x.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${h}" rx="5" fill="var(--accent)" class="fab-bar" style="animation-delay:${Math.min(k*20,300)}ms"><title>${esc2(r[0].slice(5))} ${(r[1]/60).toFixed(1)}h</title></rect><text x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc2(r[0].slice(8))}</text>`}).join("");
    box.innerHTML=`<div class="fab-big"><b>${(tot/60).toFixed(1)}</b><span>시간</span></div><div class="fab-sub">어제까지 시간외 · ${rows.length}일</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="날짜별 시간외 막대그래프">${bars}</svg>`;};
  const show=on=>{p.classList.toggle("on",on);if(on)drawT()};
  show(pinned);
  b.onclick=()=>show(!p.classList.contains("on"));
  pin.onchange=()=>{try{localStorage.setItem("dsac_fab_pin",pin.checked?"1":"0")}catch(e){}};
  p.onclick=e=>{const g=e.target.closest("[data-go]");if(!g)return;const el=document.querySelector('[data-mode="'+g.dataset.go+'"]');if(el)el.click();if(!pin.checked)show(false)};
})();
</script>

<script>
(function(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(standalone)return;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const ip=document.createElement("button");ip.className="inst-pill";ip.textContent="바탕화면에 설치";
  document.body.append(ip);
  let dp=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;ip.hidden=false});
  window.addEventListener("appinstalled",()=>{dp=null;ip.hidden=true});
  if(ios){ip.textContent="홈 화면에 추가";ip.hidden=false}
  ip.onclick=async()=>{
    if(ios){try{toast("사파리 하단의 공유 버튼을 누르고 '홈 화면에 추가'를 선택하세요")}catch(e){}return}
    if(!dp){try{toast("주소창 오른쪽의 설치 아이콘이나 브라우저 메뉴의 '앱 설치'를 눌러 주세요. 안 뜨면 edge://apps 에서 예전 앱을 지운 뒤 다시 시도해 주세요")}catch(e){}return}
    dp.prompt();try{await dp.userChoice}catch(e){}dp=null;ip.hidden=true;
  };
})();
</script>
