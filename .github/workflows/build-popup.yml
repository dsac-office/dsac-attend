name: Build popup exe (Windows)

on:
  push:
    branches: [main]
    paths:
      - "tools/popup/**"
      - "tools/launcher/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 아이콘 복사
        shell: pwsh
        run: Copy-Item "tools/launcher/근무관리.ico" "tools/popup/app.ico" -Force

      - name: exe 빌드
        shell: cmd
        run: |
          cd tools\popup
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /win32icon:app.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:System.Security.dll /out:DSAC-Popup.exe Popup.cs

      - name: zip 만들기
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force downloads | Out-Null
          Compress-Archive -Path tools/popup/DSAC-Popup.exe -DestinationPath downloads/dsac-popup.zip -Force

      - name: 저장소에 올리고 사이트 다시 배포
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/dsac-popup.zip
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "팝업 zip 빌드 결과 갱신"
            git push origin HEAD:main
          fi
          gh workflow run firebase-hosting.yml --ref main
